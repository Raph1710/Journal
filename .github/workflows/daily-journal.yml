name: Daily Coursework Journal Submission

on:
  schedule:
    # 4:00 PM IST (16:00 IST) = 10:30 AM UTC, Monday–Friday (Daily Form Submission)
    - cron: '30 10 * * 1-5'
    # 4:00 PM IST = 10:30 AM UTC, Saturday & Sunday (Session Keepalive Heartbeat)
    - cron: '30 10 * * 0,6'
  workflow_dispatch:

jobs:
  submit-journal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Decode storageState.json from Secret
        env:
          STORAGE_STATE_BASE64: ${{ secrets.STORAGE_STATE_BASE64 }}
        run: |
          if [ -z "$STORAGE_STATE_BASE64" ]; then
            echo "::error::STORAGE_STATE_BASE64 secret is missing or empty!"
            exit 1
          fi
          echo "$STORAGE_STATE_BASE64" | tr -d '\r\n' | base64 -d > storageState.json
          echo "storageState.json restored successfully."

      - name: Run Journal Submission Script
        id: submit
        env:
          FORM_ID: ${{ secrets.FORM_ID }}
          ENTRY_MAP: ${{ secrets.ENTRY_MAP }}
          GH_OWNER: ${{ secrets.GH_OWNER }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          COMMIT_READ_TOKEN: ${{ secrets.COMMIT_READ_TOKEN }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          STORAGE_STATE_PATH: storageState.json
          DISABLE_SUBMIT: "false"
          DRY_RUN: "false"
        run: |
          # Detect weekend days (Saturday=6, Sunday=7 in ISO %u)
          DAY_OF_WEEK=$(date -u +%u)
          if [ "$DAY_OF_WEEK" -ge 6 ]; then
            echo "Weekend detected (day $DAY_OF_WEEK): Running keepalive session refresh to keep Google tokens active."
            node src/submit.js --keepalive
          else
            npm start
          fi

      - name: Write back updated storageState to GitHub Secrets
        if: always() && steps.submit.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.COMMIT_READ_TOKEN }}
        run: |
          if [ -f storageState.json ]; then
            if [ -z "$GH_TOKEN" ]; then
              echo "::warning::COMMIT_READ_TOKEN is not set; cannot automatically update STORAGE_STATE_BASE64 secret."
            else
              echo "Encoding updated storageState.json to base64..."
              NEW_STATE_BASE64=$(base64 -w 0 storageState.json)
              echo "Syncing updated session state back to STORAGE_STATE_BASE64 secret..."
              gh secret set STORAGE_STATE_BASE64 --body "$NEW_STATE_BASE64" --repo "${{ github.repository }}"
              echo "✅ Successfully synced fresh session state back to STORAGE_STATE_BASE64 secret."
            fi
          else
            echo "⚠️ storageState.json not found, skipping secret sync."
          fi
